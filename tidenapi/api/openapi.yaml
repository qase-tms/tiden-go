        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - description: filter the result to one subject ("component"|"feature"|"product")
        explode: true
        in: query
        name: subjectType
        required: false
        schema:
          type: string
        style: form
      - description: paired with subject_type
        explode: true
        in: query
        name: subjectId
        required: false
        schema:
          type: string
        style: form
