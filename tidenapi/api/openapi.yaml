        allowUndistilled:
          description: |-
            allow_undistilled overrides the INTENT_UNDISTILLED merge guard: a branch
            carrying an intent session that is not closed, has no recorded
            settlement, and has requirement changes normally refuses to merge. This
            is a recorded human decision — true merges anyway and stamps the
            override (session id, actor) onto the merge's activity event. Branches
            with no intent session record are never blocked, so this is a no-op for
            them.
          type: boolean
      type: object
