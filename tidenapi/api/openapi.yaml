      - ReleaseService
  /v1/products/{productId}/repo-watermark:
    get:
      description: |-
        The watermark is the git commit the requirements tree on main reflects the
        repository up to ("github.com/org/repo" canonical id). `tiden intent
        start` compares it against the repo's actual main HEAD to detect drift —
        commits that reached the code outside the intent loop. An unset watermark
        means the repository was never reconciled; the client baselines it.
      operationId: AgentRetrievalService_GetRepoWatermark
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: |-
          Canonical repo id ("github.com/org/repo" — the components.repository
          format), never a local path and never a clone URL.
        explode: true
        in: query
        name: repository
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRepoWatermarkResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Returns the drift watermark of one repository.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/repo-watermark:advance:
    post:
      description: |-
        reason baseline inserts the first watermark and never overwrites;
        empty_sync is a compare-and-set on expected_current_sha (a delta run that
        found nothing requirement-worthy); bootstrap writes unconditionally (an
        explicit full re-generation). The sync_merge advance happens server-side
        when a sync branch merges, and ingest happens inside the codebase agent —
        both are rejected here. advanced=false means a lost ordering race, never
        an error: the watermark can under-advance and self-heal, but never move
        backwards.
      operationId: AgentRetrievalService_AdvanceRepoWatermark
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceRepoWatermarkBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvanceRepoWatermarkResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Advances the drift watermark of one repository.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirement-anchors:
    get:
      description: |-
        Returns every (requirement_id, repo_path) pair from repo_file source
        anchors as seen from branch (empty = main), so a client can map file
        paths to requirements without fetching full requirements.
      operationId: AgentRetrievalService_ListRequirementAnchors
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: empty = main
        explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRequirementAnchorsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists the branch-effective code anchors of all requirements.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirement-components:derive:
    post:
      description: |-
        Mirrors the test-side attributeTestComponents: a requirement whose
        anchors resolve to exactly one component gets that component_id set;
        anchors spanning more than one component, or owned by none (including a
        repository-ambiguous anchor path), leave the requirement untouched. Only
        NULL component_id rows are written — an explicit or previously-derived
        attribution is never overwritten. Idempotent.
      operationId: RequirementService_AttributeRequirementComponents
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeRequirementComponentsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: |-
        Derives requirement-component attribution from each requirement's own
        repo_file anchors.
      tags:
      - RequirementService
  /v1/products/{productId}/requirement-edge-intents:
    post:
      description: |-
        Stores an edge intent on the given branch (empty = main) instead of
        writing the edge immediately; the intent materializes into a real edge
        when the branch merges to main. Endpoint and edge_type rules match
        WriteRequirementEdge.
      operationId: AgentRetrievalService_DeclareRequirementEdgeIntent
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareRequirementEdgeIntentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclareRequirementEdgeIntentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Records a deferred graph edge for endpoints not yet on main.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirement-edges:
    post:
      description: |-
        Creates a src->dst edge with exactly one destination endpoint:
        dst_requirement_id (edge_type depends_on | traces_to) or dst_component_id
        (edge_type impacts_component). confidence is required — an explicit 0.0 is
        valid, omitted is not. The edge is attributed to agent_run_id; the created
        edge id is returned.
      operationId: AgentRetrievalService_WriteRequirementEdge
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteRequirementEdgeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteRequirementEdgeResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Writes one semantic edge into the requirement graph.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirement-graph:
    get:
      description: |-
        Returns every graph node (requirements plus component nodes reached via
        impacts_component edges, discriminated by kind) and every edge with its
        type, source kind, and confidence — for whole-product visualization or
        offline analysis.
      operationId: AgentRetrievalService_GetRequirementGraph
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRequirementGraphResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Returns the product's full requirement graph.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirements:
    get:
      description: |-
        Returns the flat requirement list (parent_id encodes the tree) in the
        branch view (empty = main), paginated. Set include_sources to embed each
        requirement's full provenance sources — agents need them for source-based
        identity matching; otherwise only source_count is populated.
      operationId: RequirementService_ListRequirements
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - description: |-
          When true, each returned requirement carries its full sources list (not
          just source_count). Agents need this for source-based identity matching
          (e.g. github_local_id / jira_issue anchors); the web UI leaves it off.
        explode: true
        in: query
        name: includeSources
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRequirementsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a product's requirements.
      tags:
      - RequirementService
    post:
      description: |-
        Creates the requirement under parent_id (empty = root) on branch (empty =
        main; a missing branch name is auto-created and edits stay copy-on-write
        until merge). Optional status/priority/type classify it; sources attach
        provenance (repo files, documentation URLs, manual input). Returns the
        requirement with its product-wide seq_num.
      operationId: RequirementService_CreateRequirement
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequirementBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRequirementResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Creates a requirement.
      tags:
      - RequirementService
  /v1/products/{productId}/requirements/graph-coverage-gaps:
    get:
      description: |-
        Returns the subset of the given requirement_ids that have zero live test
        links. Typically chained after RequirementImpact or RequirementNeighbors
        to find the uncovered part of a blast radius.
      operationId: AgentRetrievalService_GraphCoverageGaps
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: |-
          requirement_ids is the set to check for coverage. Typically the result of
          RequirementImpact or RequirementNeighbors.
        explode: true
        in: query
        name: requirementIds
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCoverageGapsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Filters a requirement set down to those without test coverage.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirements/impact:
    get:
      description: |-
        Resolves repo_paths to seed requirements via their repo_file source
        anchors, then expands the requirement graph up to depth hops (default 3)
        over the given edge_types (empty = all canonical types). Returns the
        affected requirement ids, the tests covering any of them, and the affected
        requirements with no live test links.
      operationId: AgentRetrievalService_RequirementImpact
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: |-
          repo_paths is the set of changed file paths (e.g. from a merged PR).
          The backend resolves these to seeded requirement IDs via requirement_sources.
        explode: true
        in: query
        name: repoPaths
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: |-
          depth controls how many hops the graph traversal expands beyond the seeds.
          Defaults to 3 on the server if <= 0.
        explode: true
        in: query
        name: depth
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: edge_types filters which edge types to traverse. Empty = all
          canonical types.
        explode: true
        in: query
        name: edgeTypes
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: |-
          repository scopes repo_paths to one repository: the canonical repo id
          (e.g. "github.com/acme/backend") OR a local checkout alias resolved
          via component repository_aliases — same semantics as ChangedFile.repository.

          Anchors carry only a repo-relative path, so identical paths in different
          repositories (".github/workflows/ci.yml", "Makefile", "CLAUDE.md") collide.
          When set, a seed is kept only if its requirement's component resolves to
          this repository; requirements with no component still seed (fail-open) and
          are counted in ImpactCoverage.unverified_repository_seeds.

          Empty = no repository filtering (pre-existing behaviour).
        explode: true
        in: query
        name: repository
        required: false
        schema:
          type: string
        style: form
      - description: |-
          min_confidence bounds which edges the traversal may step onto: a NULL
          confidence always passes (parent edges carry none, so the requirement tree
          is never pruned), and a derived edge (co_anchored/covers, confidence =
          1/fan-out) below the floor is not admitted. Default 0 = no floor, the
          pre-existing unbounded behaviour — every caller that omits this field sees
          byte-identical results to before it existed. A caller that wants to bound a
          hub-file's fan-out (e.g. the intent-loop close gate) sets it explicitly;
          impact-analysis callers that want the deliberately broad radius leave it at 0.
        explode: true
        in: query
        name: minConfidence
        required: false
        schema:
          format: double
          type: number
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementImpactResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Computes the requirement blast radius of a set of changed files.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirements/{requirementId}/neighbors:
    get:
      description: |-
        Traverses the requirement graph from requirement_id up to depth hops
        (default 1) over the given edge_types (empty = all canonical types) and
        returns the reachable requirement ids.
      operationId: AgentRetrievalService_RequirementNeighbors
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: requirementId
        required: true
        schema:
          type: string
        style: simple
      - description: depth controls how many hops to traverse (default 1 if <= 0).
        explode: true
        in: query
        name: depth
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: edge_types filters which edge types to traverse. Empty = all
          canonical types.
        explode: true
        in: query
        name: edgeTypes
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementNeighborsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists the graph neighbors of one requirement.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirements/{requirementId}/test-context:
    get:
      description: |-
        Returns the requirement with its parent/children/siblings, component,
        linked/proposed/relevant tests, stale-coverage signals, extracted
        test-oriented fields (acceptance criteria, edge cases, ...), agent memory,
        and citations, resolved in the branch view (empty branch = main). budget
        caps the pack's approximate token size; truncation_signals reports what
        was cut to fit.
      operationId: AgentRetrievalService_GetRequirementTestContext
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: requirementId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - description: |-
          budget bounds the pack's approximate token size: smaller budgets shrink
          per-list limits and trim long excerpts; <= 0 uses server defaults.
        explode: true
        in: query
        name: budget
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRequirementTestContextResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Builds the full test-authoring context pack for one requirement.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/requirements/{requirementId}:attribute-changed-files:
    post:
      description: |-
        Maps repo-qualified changed files to components via the main-branch
        component scopes, declares one idempotent impacts_component edge intent
        per touched component, and sets requirement.component_id when the files
        resolve to exactly one component (clears it when they span several). All
        files must belong to a single repository; unmatched files are returned.
      operationId: AgentRetrievalService_AttributeChangedFiles
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: requirementId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeChangedFilesBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeChangedFilesResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Attributes a requirement's changed files to owning components.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/runs:
    get:
      description: |-
        Filter by status (new | in_progress | passed | failed | aborted),
        environment slug, branch name, or title substring via search. Paginated
