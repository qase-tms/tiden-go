  /v1/products/{productId}/quality-gate:
    get:
      description: |-
        Returns the latest non-invalidated verdict for the (scope, ref). On a
        blocked verdict, clients read the structured per-subject criterion
        breakdown and agent-actionable fix hints from here.
      operationId: QualityGateService_GetVerdict
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: |2-
           - VERDICT_SCOPE_RELEASE: canonical, against main-live entities of a release build
           - VERDICT_SCOPE_BRANCH: pre-merge preview, against the merge-preview projection
           - VERDICT_SCOPE_MAIN: current main, not tied to a release (latest exec per test)
        explode: true
        in: query
        name: scope
        required: false
        schema:
          default: VERDICT_SCOPE_UNSPECIFIED
          enum:
          - VERDICT_SCOPE_UNSPECIFIED
          - VERDICT_SCOPE_RELEASE
          - VERDICT_SCOPE_BRANCH
          - VERDICT_SCOPE_MAIN
          type: string
        style: form
      - explode: true
        in: query
        name: releaseId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - description: filter the result to one subject ("component"|"feature"|"product")
        explode: true
        in: query
        name: subjectType
        required: false
        schema:
          type: string
        style: form
      - description: paired with subject_type
        explode: true
        in: query
        name: subjectId
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVerdictResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches the latest verdict for a scope.
      tags:
      - QualityGateService
  /v1/products/{productId}/quality-gate/traceability:
