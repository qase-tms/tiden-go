    DeclareRequirementEdgeIntentBody:
      description: |-
        DeclareRequirementEdgeIntent records a deferred semantic edge for a brand-new
        feature whose endpoint(s) are not yet on main. The intent is stored on the
        branch and materialized into a real edge when the branch merges to main.
      example:
        dstComponentId: dstComponentId
        dstRequirementId: dstRequirementId
        edgeType: edgeType
        confidence: 0.8008281904610115
        srcRequirementId: srcRequirementId
        branch: branch
        rationale: rationale
      properties:
        branch:
          description: branch is the branch the intent is declared on (empty = main).
          type: string
        srcRequirementId:
          type: string
        dstRequirementId:
          description: |-
            Exactly one dst endpoint (see WriteRequirementEdgeRequest). dst_requirement_id
            may be empty when dst_component_id is set.
          type: string
        edgeType:
          description: |-
            edge_type must be "depends_on"/"traces_to" (req→req) or "impacts_component"
            (req→component).
          type: string
        confidence:
          description: "confidence must be provided; explicit 0.0 is valid, omitted\
            \ is not."
          format: double
          type: number
        rationale:
          type: string
        dstComponentId:
          description: |-
            dst_component_id sets a req→component endpoint (shift-left v3). Mutually
            exclusive with dst_requirement_id.
          type: string
      type: object
    DeclareRequirementEdgeIntentResponse:
      example:
        intentId: intentId
      properties:
        intentId:
