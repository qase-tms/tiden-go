          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists requirements with insufficient test coverage.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/environments:
    get:
      description: |-
        Returns all environments of the product with page_size/page_token
        pagination.
      operationId: EnvironmentService_ListEnvironments
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvironmentsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a product's environments.
      tags:
      - EnvironmentService
    post:
      description: |-
        Environments (e.g. production, staging) label where test runs and releases
        happened. slug is the stable identifier reporters and CI reference in
        CreateTestRun/CreateRelease; those endpoints also auto-create unknown
        slugs, so explicit creation is only needed to control name/host/type.
      operationId: EnvironmentService_CreateEnvironment
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEnvironmentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Creates an environment in a product.
      tags:
      - EnvironmentService
  /v1/products/{productId}/feature-context:
    get:
      description: |-
        Retrieves the requirement-graph slices relevant to the free-text objective
        (and optional changed repo_paths): per feature, the root requirement, the
        touched nodes with their code anchors, the branch-effective coverage of
        that slice, and the retrieval signals (vector | fts | anchor) that
        surfaced the seeds. k bounds each retrieval signal's breadth.
      operationId: AgentRetrievalService_ResolveFeatureContext
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: empty = main
        explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - description: text is the free-text coding objective to resolve into feature
          context.
        explode: true
        in: query
        name: text
        required: false
        schema:
          type: string
        style: form
      - description: repo_paths are optional changed file paths that seed anchor retrieval.
        explode: true
        in: query
        name: repoPaths
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: k bounds each retrieval signal's breadth (server default when
          <= 0).
        explode: true
        in: query
        name: k
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveFeatureContextResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Resolves a coding objective into feature-rooted requirement context.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/intent-sessions:
    get:
      description: |-
        Filter by status, git_branch (resolving "which session, if any, has this
        branch open" for cross-machine continuation), or branch_id. Also serves
        as the capability probe for the whole RPC family: an older server 404s
        this collection route. effective_status ("expired" | "stale") filters by
        the derived-expiry predicate instead of the stored status column — see
        IntentSession.effective_status — and is rejected together with status.
      operationId: IntentSessionService_ListIntentSessions
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: "optional filter — the stored column, verbatim"
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: optional filter — cross-machine "find my open session"
        explode: true
        in: query
        name: gitBranch
        required: false
        schema:
          type: string
        style: form
      - description: optional filter
        explode: true
        in: query
        name: branchId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      - description: |-
          effective_status is an optional filter selecting by the DERIVED status
          instead of the stored column: "expired" (provisional sessions idle past
          the provisional TTL) or "stale" (materialized sessions idle past the
          materialized TTL). Mutually exclusive with status.
        explode: true
        in: query
        name: effectiveStatus
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIntentSessionsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: "Lists a product's sessions, most recently active first."
      tags:
      - IntentSessionService
    post:
      description: |-
        Only fields set in the request overwrite; every other column on the
        existing row is left as-is. Creating a session (the first call for that
        id) requires objective. status is forward-only
        (provisional -> materialized -> closed); a closed session rejects any
        further upsert, including one that doesn't touch status. Every call
        refreshes last_activity_at. radius_drops, if present, are recorded as
        radius_drop judgements under their supersede key
        (session_id, phase, sorted requirement_ids).
      operationId: IntentSessionService_UpsertIntentSession
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertIntentSessionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertIntentSessionResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: "Creates or patches a session, keyed by the client-generated session\
        \ id."
      tags:
      - IntentSessionService
  /v1/products/{productId}/intent-sessions/{sessionId}:
    get:
      operationId: IntentSessionService_GetIntentSession
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sessionId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIntentSessionResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one session by id.
      tags:
      - IntentSessionService
  /v1/products/{productId}/intent-sessions/{sessionId}:settle:
    post:
      description: |-
        items are merged onto the stored settlement by item_id: resending an
        item_id replaces its entry (the idempotent retry path after a partial
        failure), a new item_id appends. nothing_to_distill replaces wholesale
        and is mutually exclusive with items — sending one clears the other on
        the stored row; sending both in the same request is rejected.
        Validation here is structural only (enum membership, non-empty reason,
        id fields parsing as UUIDs) — the CLI enforces the semantic rules (e.g.
        judged_ids required when hops-0 is non-empty) since the server has no
        way to know hops-0.
      operationId: IntentSessionService_RecordSessionSettlement
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sessionId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordSessionSettlementBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordSessionSettlementResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Records or amends a session's settlement decision.
      tags:
      - IntentSessionService
  /v1/products/{productId}/intent:distill:
    post:
      description: |-
        Runs an LLM reconciliation of the transcript against the product's
        requirement tree and writes the created/updated requirements to an
        intent/YYYY-MM-DD-<slug> branch for review (slug defaults to "session";
        same-day non-open branch names get a -2..-9 suffix). Requires a usable
        llm.* workspace credential (credential_id overrides the default). An empty
        transcript is a readiness probe: configuration is validated and the call
        reports skipped=true without invoking the LLM.
      operationId: IntentService_DistillIntent
      parameters:
      - description: Product whose requirement tree the intent is reconciled against.
        explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistillIntentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistillIntentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Distills a coding-session transcript into requirement changes.
      tags:
      - IntentService
  /v1/products/{productId}/issues:
    get:
      description: |-
        An issue is a group of error events sharing a fingerprint. Filter by
        status, environment, release, component, platform, level, and a trailing
        last-seen window; sort by last_seen (default), first_seen, or times_seen.
        Results are paginated with an opaque keyset cursor carried in
        pagination.page_token.
      operationId: IssueService_ListIssues
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: "unresolved|resolved|ignored, \"\" = all"
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: optional filter
        explode: true
        in: query
        name: environmentId
        required: false
        schema:
          type: string
        style: form
      - description: optional filter
        explode: true
        in: query
        name: releaseId
        required: false
        schema:
          type: string
        style: form
      - description: last_seen|first_seen|times_seen
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      - description: "optional: filter by attributed component"
        explode: true
        in: query
        name: componentId
        required: false
        schema:
          type: string
        style: form
      - description: "optional: filter by platform (platform dropdown, OR within)"
        explode: true
        in: query
        name: platforms
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "optional: filter by level (token bar, OR within)"
        explode: true
        in: query
        name: levels
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "optional last-seen window: 3m|1h|12h|1d|7d|30d (\"\" = all time)"
        explode: true
        in: query
        name: period
        required: false
        schema:
          type: string
        style: form
      - description: "optional: case-insensitive match on title/culprit"
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: "optional saved-view predicate: blocking|spiking|new|regressed"
        explode: true
        in: query
        name: signal
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIssuesResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: "Lists a product's issues, most recently active first."
      tags:
      - IssueService
  /v1/products/{productId}/issues/{issueId}/fix-context:
    get:
      description: |-
        Prefer this over stitching together GetIssue, GetIssueEventStats and
        requirement lookups: it is one round-trip, and it reports which file path
        matched which requirement so a wrong match is visible rather than silent.
      operationId: AgentRetrievalService_GetIssueFixContext
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: issueId
        required: true
        schema:
          type: string
        style: simple
      - description: |-
          branch scopes the requirement lookup to a branch's effective view.
          "" = main.
        explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - description: |-
          max_frames bounds how many stack frames come back. <= 0 uses the server
          default (10); the cap is 50.
        explode: true
        in: query
        name: maxFrames
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIssueFixContextResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: |-
        Returns everything needed to fix one error, in a single call: the issue,
        its latest occurrence with symbolicated stack frames, the repository files
        those frames implicate, where the error is happening by environment, and —
        for each requirement those files implement — whether a test already covers
        it.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/issues:bulkSetStatus:
