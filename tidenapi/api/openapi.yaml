openapi: 3.0.0
info:
  description: "REST API for external consumers: the tiden CLI, reporters, and generated\
    \ API clients. Authenticate with an API token (`Authorization: Bearer tfy_...`)\
    \ created in the app UI or via the CLI device-code flow."
  title: Tiden Public API
  version: 1.0.0
servers:
- url: https://api.tiden.ai
security:
- BearerAuth: []
tags:
- name: AgentService
- name: AgentRetrievalService
- name: AgentRunService
- name: AuthService
- name: BranchService
- name: ComponentService
- name: EnvironmentService
- name: IntentService
- name: IssueService
- name: ProductService
- name: QualityGateService
- name: ReleaseService
- name: RequirementService
- name: TestService
- name: TestRunService
- name: WorkspaceService
paths:
  /v1/agent-configs/{agentConfigId}/runs:
    get:
      operationId: AgentRunService_ListAgentRuns
      parameters:
      - explode: false
        in: path
        name: agentConfigId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentRunsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentRunService
    post:
      operationId: AgentRunService_StartAgentRun
      parameters:
      - explode: false
        in: path
        name: agentConfigId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentRunBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartAgentRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentRunService
  /v1/agent-configs/{id}:
    delete:
      operationId: AgentService_DeleteAgentConfig
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAgentConfigResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentService
    get:
      operationId: AgentService_GetAgentConfig
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAgentConfigResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentService
  /v1/agent-runs/{id}:
    get:
      operationId: AgentRunService_GetAgentRun
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAgentRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentRunService
  /v1/agent-runs/{id}:cancel:
    post:
      operationId: AgentRunService_CancelAgentRun
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAgentRunBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelAgentRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentRunService
  /v1/agent-runs/{runId}/events:
    get:
      operationId: AgentRunService_ListAgentRunEvents
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentRunEventsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentRunService
  /v1/agent-runs/{runId}/events:stream:
    get:
      operationId: AgentRunService_StreamAgentRun
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          type: string
        style: simple
      - description: resume from this event id (cursor); empty starts from the beginning.
        explode: true
        in: query
        name: afterEventId
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream_result_of_AgentRunEvent"
          description: A successful response.(streaming responses)
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentRunService
  /v1/agent-types:
    get:
      operationId: AgentService_ListAgentTypes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentTypesResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentService
  /v1/auth/me:
    get:
      operationId: AuthService_GetCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentUserResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AuthService
  /v1/auth/onboarding:
    put:
      operationId: AuthService_UpdateUserOnboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserOnboardingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserOnboardingResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AuthService
  /v1/branches/{branchId}/link-proposals:
    get:
      operationId: TestService_ListBranchLinkProposals
      parameters:
      - explode: false
        in: path
        name: branchId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: statuses
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBranchLinkProposalsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - TestService
  /v1/branches/{branchId}/link-proposals:review:
    post:
      operationId: TestService_ReviewBranchLinkProposals
      parameters:
      - explode: false
        in: path
        name: branchId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewBranchLinkProposalsBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewBranchLinkProposalsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - TestService
  /v1/branches/{id}:
    delete:
      operationId: BranchService_DeleteBranch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - BranchService
    get:
      operationId: BranchService_GetBranch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - BranchService
  /v1/branches/{id}/merge:
    post:
      operationId: BranchService_MergeBranch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeBranchBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - BranchService
  /v1/branches/{id}/merge-preview:
    get:
      operationId: BranchService_GetMergePreview
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMergePreviewResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - BranchService
  /v1/components/{id}:
    put:
      operationId: ComponentService_UpdateComponent
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateComponentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - ComponentService
  /v1/environments/{id}:
    delete:
      operationId: EnvironmentService_DeleteEnvironment
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvironmentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - EnvironmentService
    get:
      operationId: EnvironmentService_GetEnvironment
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEnvironmentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - EnvironmentService
  /v1/products/{id}:
    get:
      operationId: ProductService_GetProduct
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProductResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: |-
        GetProduct fetches one product by id so the CLI / agents can resolve a bound
        product's details (e.g. its name for `tiden doctor`) without paging the whole
        workspace list. Tenancy is enforced via the id's TENANT_ANCHOR_PRODUCT anchor.
      tags:
      - ProductService
  /v1/products/{productId}/agent-configs:
    get:
      operationId: AgentService_ListAgentConfigs
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentConfigsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentService
    post:
      operationId: AgentService_CreateAgentConfig
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentConfigBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentConfigResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentService
  /v1/products/{productId}/attachments/{hash}:
    get:
      operationId: TestRunService_GetRunAttachment
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: sha256 hex content hash
        explode: false
        in: path
        name: hash
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRunAttachmentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: |-
        Resolves a content-hash (uploaded via the reporter multipart route
        POST /v1/products/{product_id}/attachments:upload) to a presigned download
        URL. Public so reporter/CLI clients and the SPA (JWT) can both fetch;
        ATTACHMENT_NOT_FOUND (→ 404) for an unknown hash — the drawer renders
        "attachment unavailable" on that.
      tags:
      - TestRunService
  /v1/products/{productId}/branches:
    get:
      operationId: BranchService_ListBranches
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: |-
          When true, each returned Branch carries BranchChangeStats (per-branch
          change counts vs main).
        explode: true
        in: query
        name: includeStats
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBranchesResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - BranchService
    post:
      operationId: BranchService_CreateBranch
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - BranchService
  /v1/products/{productId}/components:
    get:
      operationId: ComponentService_ListComponents
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListComponentsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - ComponentService
    post:
      operationId: ComponentService_CreateComponent
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateComponentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - ComponentService
  /v1/products/{productId}/coverage-gaps:
    get:
      operationId: AgentRetrievalService_ListCoverageGaps
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: coverageStatuses
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - explode: true
        in: query
        name: componentId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      - description: scope gaps to a feature subtree (root + descendants)
        explode: true
        in: query
        name: rootRequirementId
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCoverageGapsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/environments:
    get:
      operationId: EnvironmentService_ListEnvironments
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvironmentsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - EnvironmentService
    post:
      operationId: EnvironmentService_CreateEnvironment
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEnvironmentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - EnvironmentService
  /v1/products/{productId}/feature-context:
    get:
      operationId: AgentRetrievalService_ResolveFeatureContext
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: empty = main
        explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - description: text is the free-text coding objective to resolve into feature
          context.
        explode: true
        in: query
        name: text
        required: false
        schema:
          type: string
        style: form
      - description: repo_paths are optional changed file paths that seed anchor retrieval.
        explode: true
        in: query
        name: repoPaths
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: k bounds each retrieval signal's breadth (server default when
          <= 0).
        explode: true
        in: query
        name: k
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveFeatureContextResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/intent:distill:
    post:
      operationId: IntentService_DistillIntent
      parameters:
      - description: Product whose requirement tree the intent is reconciled against.
        explode: false
        in: path
        name: productId
        required: true
