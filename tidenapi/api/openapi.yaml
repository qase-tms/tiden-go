    ImpactCoverage:
      description: |-
        ImpactCoverage distinguishes the three ways an impact answer can be empty or
        partial. Before this existed all three returned an identical empty response.
      example:
        requestedPaths: 1
        matchedPaths: 5
        blindDirectories:
        - blindDirectories
        - blindDirectories
        productHasAnchors: true
        unmatchedPaths:
        - unmatchedPaths
        - unmatchedPaths
        unverifiedRepositorySeeds: 5
      properties:
        requestedPaths:
          description: requested_paths is how many repo paths the caller sent.
          format: int32
          type: integer
        matchedPaths:
          description: |-
            matched_paths is how many of them are anchored to at least one requirement.
            0 with product_has_anchors = true means "we cannot tell", not "nothing".
          format: int32
          type: integer
        productHasAnchors:
          description: |-
            product_has_anchors is false when the product has no repo_file anchors at
            all — an empty answer then says nothing about the change.
          type: boolean
        unmatchedPaths:
          description: unmatched_paths is the requested paths that matched no anchor
            (capped).
          items:
            type: string
          type: array
        blindDirectories:
          description: |-
            blind_directories is the directories among unmatched_paths under which the
            product has no anchor at all — i.e. tiers we are structurally blind to.
          items:
            type: string
          type: array
        unverifiedRepositorySeeds:
          description: |-
            unverified_repository_seeds counts seeds kept without a repository check
            because their requirement has no component. Only set when request.repository
            is non-empty; it should fall to 0 as components get assigned.
          format: int32
          type: integer
      type: object
    ImpactedRequirement:
      description: |-
        ImpactedRequirement is one affected requirement plus how the traversal reached
        it. hops = 0 means a changed file is anchored directly to this requirement —
        those are the high-precision hits; everything above 0 is a graph inference and
        should be presented as possibly-related, not as scope.
      example:
        viaConfidence: 6.027456183070403
        anchorPaths:
        - anchorPaths
        - anchorPaths
        viaEdgeType: viaEdgeType
        hops: 0
        requirementId: requirementId
      properties:
        requirementId:
          type: string
        hops:
          description: hops is the shortest number of graph edges from any seed. 0
            = direct anchor.
          format: int32
          type: integer
        viaEdgeType:
          description: |-
            via_edge_type is the edge type that first reached this requirement at `hops`
            ("parent", "covers", "co_anchored", …). Empty when hops = 0.
          type: string
        viaConfidence:
          description: |-
            via_confidence is that edge's confidence, when the edge carries one.
            Derived co_anchored/covers confidence is 1/fan-out; parent edges have none.
          format: double
          type: number
        anchorPaths:
          description: |-
            anchor_paths lists the requested repo paths anchored to this requirement.
            Populated only when hops = 0.
          items:
            type: string
          type: array
      type: object
    IngestError:
      description: IngestError is one per-entry validation failure from an ingest
        batch.
      example:
        code: code
        externalId: externalId
        message: message
      properties:
        externalId:
