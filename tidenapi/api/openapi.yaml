    BranchLoopStats:
      description: |-
        BranchLoopStats summarizes a branch's self-closing loop from its
        quality-gate verdict history (same append-only quality_gate_verdicts
        stream as the analytics "self-closing loop time" story), but — unlike that
        story's ReworkLoops/AgentReworkLoops primitives — INCLUDES branches that
        never went green, so a branch table can show a stuck loop instead of
        silently omitting it. Populated only by ListBranches with
        include_status=true.
      example:
        loopCycles: 1
        blockedBeforePass: 7
        wentGreen: true
        runCount: 1
        verdictCycles: 4
      properties:
        verdictCycles:
          format: int32
          type: integer
        blockedBeforePass:
          format: int32
          type: integer
        wentGreen:
          type: boolean
        runCount:
          format: int32
          type: integer
        loopCycles:
          description: |-
            loop_cycles is the requirement-coverage-rung judgment-cycle count
            (branches.loop_cycle_count) — how many times a branch-scope compute's
            per-requirement coverage rung actually moved, distinct from
            verdict_cycles above (a count of gate STATE CHANGES, which rises on its
            own once the gate goes per-stage). Absent when the branch was never
            counted (loop_cycle_progress_key IS NULL: pre-cutover, or no
            branch-scope verdict yet) — never the same as an explicit zero.
          format: int32
          type: integer
      type: object
