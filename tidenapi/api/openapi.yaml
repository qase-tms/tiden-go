      operationId: TestRunService_ListTestRuns
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: optional filter
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: optional environment slug filter
        explode: true
        in: query
        name: environment
        required: false
        schema:
          type: string
        style: form
      - description: optional branch_name filter
        explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - description: optional title substring
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTestRunsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a product's test runs.
      tags:
      - TestRunService
    post:
      description: |-
        The run is the container ReportResults writes into. environment is a slug,
        auto-created when unknown; branch is the git branch name (CI metadata used
        for test matching — no Tiden branch is created); title defaults to
        "Automated run <RFC3339>" server-side. The returned run's seq_num is the
        run_seq every other run endpoint addresses.
      operationId: TestRunService_CreateTestRun
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestRunBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTestRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Creates a test run to report CI results into.
      tags:
      - TestRunService
  /v1/products/{productId}/runs/{runSeq}:
