    Product:
      description: |-
        Product is the top-level container for requirements, tests, runs, and
        releases. code is the reference prefix for entity sequence numbers
        ({CODE}-{seq}).
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        code: code
        liveDocEnabled: true
        teamId: teamId
        name: name
        description: description
        id: id
        workspaceId: workspaceId
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        code:
          type: string
        liveDocEnabled:
          description: |-
            Gates live-documentation mode: on test-run completion the test repository
            is reconciled from the run's results. Default on.
          type: boolean
        teamId:
          description: |-
            Team owner. Empty = workspace-owned (visible to all workspace members);
            set = team-owned (visible to that team's members + workspace owners/admins).
          type: string
      type: object
    ProductListSummary:
      description: |-
        ProductListSummary is a per-product rollup for the products list page.
        Counts use main-branch, non-deleted semantics matching the product overview.
      example:
        testCaseCount: 6
        openBranchCount: 1
        requirementCount: 0
        lastActivityAt: 2000-01-23T04:56:07.000+00:00
        activationState: activationState
      properties:
        requirementCount:
          format: int32
          type: integer
        testCaseCount:
          format: int32
          title: kind = "case" only
          type: integer
        openBranchCount:
          format: int32
          type: integer
        activationState:
          title: '"new" | "setup" | "ready" | "review"'
          type: string
        lastActivityAt:
          format: date-time
          title: unset = no activity
          type: string
      type: object
    ProductSetupAgentStatus:
      description: |-
        ProductSetupAgentStatus reports one coding agent found in the bound repo
        and whether its Tiden hooks are wired.
      example:
        wired: true
        agent: agent
        detected: true
