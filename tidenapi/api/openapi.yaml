    DistillIntentBody:
      description: |-
        DistillIntentRequest carries one coding session — the rendered transcript
        plus session metadata — to reconcile into the product's requirement tree.
      example:
        agent: agent
        transcript: transcript
        changedFiles:
        - changedFiles
        - changedFiles
        credentialId: credentialId
        model: model
        sessionId: sessionId
        slug: slug
      properties:
        transcript:
          description: |-
            Rendered conversation (normalized, slim — user/assistant text only).
            Agent-specific transcript formats are not accepted.
          type: string
        credentialId:
          description: |-
            Optional LLM credential to use. When empty, the backend picks the first
            usable llm.* credential in the product's workspace.
          type: string
        model:
          description: |-
            Optional model override; when empty, falls back to the credential's
            metadata "model" field.
          type: string
        slug:
          description: "Optional branch slug override; when empty, defaults to \"\
            session\"."
          type: string
        changedFiles:
          description: |-
            Repo-relative paths of files changed in the coding session (from git
            post-commit hook). The backend validates LLM-emitted repo_file anchors
            against this allowlist, dropping any path not in the set. Empty = no
            anchors written (backward-compatible: older CLI sends nothing).
          items:
            type: string
          type: array
        sessionId:
          description: |-
            Coding-session identity. When either is set, every created/updated
            requirement gets a manual_input "Intent capture" provenance source carrying
            {sessionId, agent}, so a reviewer can trace it back to the session that
            produced it. Both empty (older CLI) writes no provenance source.
          type: string
        agent:
          type: string
      type: object
