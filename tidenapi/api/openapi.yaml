      description: |-
        AttributeChangedFiles maps a requirement's repo-qualified
        changed files to components via the MAIN component scope, declares one
        idempotent impacts_component edge-intent per touched component, and
        sets/clears requirement.component_id. Enforces the one-repo-per-node
        invariant: the changed files must belong to a single repository.
      example:
        changedFiles:
        - path: path
          repository: repository
          status: status
        - path: path
          repository: repository
          status: status
        branch: branch
      properties:
        branch:
          description: branch the requirement lives on (empty = main).
          type: string
        changedFiles:
          items:
            $ref: "#/components/schemas/ChangedFile"
          type: array
      type: object
    AttributeChangedFilesResponse:
      example:
        componentId: componentId
        attributed:
        - path: path
          componentId: componentId
          repository: repository
        - path: path
          componentId: componentId
          repository: repository
        unmatched:
        - path: path
          repository: repository
          status: status
        - path: path
          repository: repository
          status: status
      properties:
        attributed:
          items:
            $ref: "#/components/schemas/AttributedChangedFile"
          type: array
        unmatched:
          items:
            $ref: "#/components/schemas/ChangedFile"
          type: array
        componentId:
          description: |-
            component_id is set when the files resolve to exactly ONE component
            (requirement.component_id was set to it); empty when they span multiple
            components (cleared) or none.
          type: string
      type: object
    AttributeRequirementComponentsResponse:
      example:
        attributedCount: 6
        attributed:
        - requirementTitle: requirementTitle
          componentId: componentId
