        pagination.page_size/page_token.
      operationId: TestRunService_ListRunResults
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: runSeq
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: optional filter (latest attempt status)
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: optional title substring
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: "optional: all attempts of one case identity"
        explode: true
        in: query
        name: identityKey
        required: false
        schema:
          type: string
        style: form
      - description: collapse retries (default false = all rows)
        explode: true
        in: query
        name: latestOnly
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunResultsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a run's reported results.
      tags:
      - TestRunService
  /v1/products/{productId}/runs/{runSeq}/results/{resultId}:
    get:
      description: |-
        Returns the full result including steps, parameters, stacktrace, and
        attachment hashes (resolve via GetRunAttachment).
      operationId: TestRunService_GetRunResult
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: runSeq
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - explode: false
        in: path
        name: resultId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRunResultResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one reported result by id.
      tags:
      - TestRunService
  /v1/products/{productId}/runs/{runSeq}/results:report:
    post:
      description: |-
        Accepts 1..2000 results per call. The batch is validated up front; on
        failure nothing is written and per-entry errors are returned (HTTP 400,
        also attached as google.rpc.Status details for gRPC clients). Each
        result's id is an idempotency key — resends count as duplicates and are
        skipped, so retrying a batch is safe. Results are matched to repository
        cases by testops_ids[0], then external_id, then signature (unmatched
        results are kept). Rejected once the run is completed/aborted
        (RUN_COMPLETED).
      operationId: TestRunService_ReportResults
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: runSeq
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResultsBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResultsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Reports a batch of test results into a run.
      tags:
      - TestRunService
  /v1/products/{productId}/runs/{runSeq}/summary:
    get:
      description: |-
        Aggregates the whole run into suite stats and case summaries (worst
        latest-attempt status across parameter combos, attempts, durations) so
        clients can render the run tree without paginating results.
      operationId: TestRunService_GetRunSummary
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: runSeq
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRunSummaryResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Returns per-suite and per-case rollups of a run.
      tags:
      - TestRunService
  /v1/products/{productId}/runs/{runSeq}:abort:
    post:
      description: |-
        Terminally cancels a run from new/in_progress; aborting a completed or
        already-aborted run is rejected. Stats are recomputed so a partial run
        still shows what was reported.
      operationId: TestRunService_AbortTestRun
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: runSeq
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortTestRunBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbortTestRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Aborts a run.
      tags:
      - TestRunService
  /v1/products/{productId}/runs/{runSeq}:complete:
    post:
      description: |-
        Recounts stats and derives the terminal status (passed | failed) from the
        latest attempt per execution. Idempotent: completing an already-completed
        run returns it unchanged (and retries a stuck or failed live-doc sync);
        aborted runs cannot be completed. When the product has live documentation
        enabled, completion triggers reconciliation of the test repository from
        the run's results.
      operationId: TestRunService_CompleteTestRun
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: runSeq
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTestRunBody"
