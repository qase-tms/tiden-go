  /v1/requirements/{id}:
    delete:
      description: |-
        On a branch (branch set, non-main) a main-row delete records a
        copy-on-write deletion marker that applies at merge; on main the row is
        deleted directly. Returns history_id, which the web-only
        RestoreRequirement RPC accepts to undo the delete.
      operationId: RequirementService_DeleteRequirement
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRequirementResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Deletes a requirement.
      tags:
      - RequirementService
    get:
      description: Returns the requirement including its sources and branch status.
      operationId: RequirementService_GetRequirement
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRequirementResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one requirement by id.
      tags:
      - RequirementService
    put:
      description: |-
        Only fields present on the request change; omitted optional fields keep
        their stored value. branch (empty = main) applies the edit copy-on-write.
        sources_update replaces the requirement's source set, or unions it with
        anchor-key dedup when merge=true (the agent-write mode).
      operationId: RequirementService_UpdateRequirement
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequirementBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRequirementResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Updates a requirement.
      tags:
      - RequirementService
  /v1/sourcemaps/{id}:confirm:
    post:
      description: |-
        Validates the staged object and atomically promotes it to live, so error
        events carrying the same debug_id resolve to original sources. Returns
        metadata only — never a download URL (source maps stay private).
      operationId: IssueService_ConfirmSourceMapUpload
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSourceMapUploadBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmSourceMapUploadResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Finalizes a source-map upload (phase 2 of 2).
      tags:
      - IssueService
  /v1/tests/{id}:
    delete:
      description: |-
        On a branch (branch set, non-main) a main-row delete records a
        copy-on-write deletion marker that applies at merge; on main the row is
        deleted directly.
      operationId: TestService_DeleteTest
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTestResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Deletes a test.
      tags:
      - TestService
    get:
      description: |-
        Returns the suite or case with steps, parameters, latest execution, and
        server-populated counts.
      operationId: TestService_GetTest
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTestResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one test by id.
      tags:
      - TestService
    put:
      description: |-
        Scalar optional fields change only when present. Repeated/struct fields
        use replacement semantics behind set_* flags (set_tags, set_steps,
        set_custom_fields, ...): when the flag is true the paired value replaces
        the stored one entirely (empty clears); when false it is untouched.
        branch (empty = main) applies the edit copy-on-write.
      operationId: TestService_UpdateTest
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateTestResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Updates a test suite or case.
      tags:
      - TestService
  /v1/tests/{testId}/links:
    get:
      description: |-
        On a branch view links resolve through copy-on-write (a COW copy surfaces
        its main source's links; branch-only tests have none) and read_only=true
        is returned so clients hide link editing.
      operationId: TestService_ListLinks
      parameters:
      - explode: false
        in: path
        name: testId
        required: true
        schema:
          type: string
        style: simple
      - description: "when set, links are read-only via COW"
        explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLinksResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a test's requirement links.
      tags:
      - TestService
    post:
      description: |-
        Only cases can be linked, and only within one product. With branch empty
        (main) the durable link is written immediately and idempotently (duplicate
        links are a no-op) and requirement coverage recomputes. With a branch set,
        the call records a branch link PROPOSAL instead — reviewed via
        ReviewBranchLinkProposals and materialized when the branch merges.
      operationId: TestService_LinkRequirement
      parameters:
      - explode: false
        in: path
        name: testId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequirementBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequirementResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Links a test case to a requirement.
      tags:
      - TestService
  /v1/tests/{testId}/links/{requirementId}:
    delete:
      description: |-
        With branch empty (main) the durable link is removed idempotently
        (removing a non-existent link is a no-op) and requirement coverage
        recomputes. With a branch set, the call withdraws that branch's pending
        link proposal for the (test, requirement) pair instead of touching main
        links.
      operationId: TestService_UnlinkRequirement
      parameters:
      - explode: false
        in: path
        name: testId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: requirementId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkRequirementResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Removes a test-requirement link.
      tags:
      - TestService
  /v1/workspaces:
    get:
      description: |-
        Returns each workspace with its slug and organization id, paginated via
