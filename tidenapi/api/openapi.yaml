          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTestRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Deletes a test run.
      tags:
      - TestRunService
    get:
      description: |-
        Returns the run with its status, environment, stats (latest-attempt
        counters), and live-documentation sync state.
      operationId: TestRunService_GetTestRun
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: runSeq
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTestRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one test run by its sequence number.
      tags:
      - TestRunService
  /v1/products/{productId}/runs/{runSeq}/results:
    get:
      description: |-
        Filter by latest-attempt status, title substring (search), or
        identity_key (all attempts of one case identity); latest_only collapses
