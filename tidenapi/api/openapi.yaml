    RequirementTier:
      default: REQUIREMENT_TIER_UNSPECIFIED
      description: |-
        RequirementTier splits the resolved radius by HOW a requirement was reached.
        CORE is reached by graph evidence — an anchor on a file the session changed,
        edge-reachability from such an anchor, or membership of a subtree that holds
        one — and is what a session's close policy binds to. HALO is reached by the
        text signals alone and carries a confirm-or-dismiss directive; a text-only
        match lands in halo at most, it is never dropped.

        Additive: a client built before the tier existed reads UNSPECIFIED and ignores
        it, which is exactly the pre-tier behavior (one undifferentiated radius).
      enum:
      - REQUIREMENT_TIER_UNSPECIFIED
      - REQUIREMENT_TIER_CORE
      - REQUIREMENT_TIER_HALO
      type: string
