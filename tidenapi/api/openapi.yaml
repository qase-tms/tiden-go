              $ref: "#/components/schemas/VerifyProductSetupBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyProductSetupResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Records a CLI setup verification snapshot for the product.
      tags:
      - ProductService
  /v1/products/{productId}/sourcemaps:
    post:
      description: |-
        Creates a pending source-map row keyed by debug_id and returns a presigned
        PUT URL to a staging key. Upload the raw map bytes to upload_url, then
        call ConfirmSourceMapUpload with the returned id to promote it.
      operationId: IssueService_CreateSourceMapUpload
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceMapUploadBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSourceMapUploadResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Starts a source-map upload (phase 1 of 2).
      tags:
      - IssueService
  /v1/products/{productId}/test-generation-context:prepare:
    post:
      description: |-
        Aggregates a GetRequirementTestContext pack per requirement_id plus
        codebase hints (framework, test command, style examples) under a shared
        token_budget. POST is used for the large request body only — the call
        computes a context and writes nothing.
      operationId: AgentRetrievalService_PrepareTestGenerationContext
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareTestGenerationContextBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareTestGenerationContextResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Prepares a batched test-generation context for several requirements.
      tags:
      - AgentRetrievalService
  /v1/products/{productId}/test-links:derive:
    post:
      description: |-
        Matches requirement repo_file anchors against tests' file_path.
        Exact-file matches are auto-linked durably (the Quality Gate recomputes);
        directory-proximity matches are returned as candidates for an agent to
        confirm via LinkRequirement. Idempotent. When the product spans more than
        one repository, matching is skipped entirely (multi_repo_skipped=true) —
        tests carry no repo attribution, so a bare path match could cross-link.
      operationId: TestService_DeriveTestLinks
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeriveTestLinksBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeriveTestLinksResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Derives test-requirement links from shared file anchors.
      tags:
      - TestService
  /v1/products/{productId}/tests:
    get:
      description: |-
        Returns suites and cases as a flat list (parent_id encodes the tree) in
        the branch view (empty = main), with page_size/page_token pagination.
      operationId: TestService_ListTests
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTestsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a product's tests.
      tags:
      - TestService
    post:
      description: |-
        kind selects "suite" | "case"; case-only fields (status, steps, execution,
        ...) are ignored for suites. parent_id nests the test under a suite;
        branch (empty = main) applies the write copy-on-write. Cases get a
        product-wide seq_num.
      operationId: TestService_CreateTest
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTestResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Creates a test suite or case.
      tags:
      - TestService
  /v1/products/{productId}/tests:ingest:
    post:
      description: |-
        Idempotent upsert keyed on (product, branch, external_id); branch is
        auto-created when absent (empty = main). The whole batch (1..1000 entries)
        is validated up front and applied in one transaction: on validation
        failure nothing is written and the per-entry errors are returned (HTTP
        400, also attached as google.rpc.Status details for gRPC clients). Suites
        are found-or-created from suite_path; requirement_seq_nums auto-link cases
        to requirements (main only).
      operationId: TestService_IngestTests
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestTestsBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestTestsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Batch-upserts tests from a reporter (live-documentation ingest).
      tags:
      - TestService
  /v1/releases/{id}:
