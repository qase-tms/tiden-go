  /v1/products/{productId}/quality-gate:accept-risk:
    post:
      description: |-
        Records a risk acceptance (reason required) for the whole verdict or one
        component, so a verdict failing only soft signals becomes shippable.
        Hard-blocked verdicts cannot be accepted. High-severity components need a
        distinct second approver via ApproveRisk; low-severity ones self-approve.
        Returns the recomputed verdict reflecting the acceptance.
      operationId: QualityGateService_AcceptRisk
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptRiskBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptRiskResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Signs off the residual risk on a soft-signal verdict.
      tags:
      - QualityGateService
  /v1/products/{productId}/quality-gate:approve-risk:
    post:
      description: |-
        Approves the acceptance identified by acceptance_id; the approver must be
        a different user than the one who recorded it. Returns the recomputed
        verdict.
      operationId: QualityGateService_ApproveRisk
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRiskBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveRiskResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Second-approver sign-off for a pending risk acceptance.
      tags:
      - QualityGateService
  /v1/products/{productId}/quality-gate:compute:
    post:
      description: |-
        Computes (or recomputes) the go/no-go verdict for a scope — RELEASE
        (release_id required), BRANCH (branch name required), or MAIN — and
        persists an immutable snapshot. Side-effecting, but idempotent on the
        current data state: recomputing unchanged data yields the same verdict.
        subject_type/subject_id narrow the returned breakdown to one
        component/feature/product subject.
      operationId: QualityGateService_ComputeVerdict
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeVerdictBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeVerdictResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Computes and persists a quality-gate verdict.
      tags:
      - QualityGateService
  /v1/products/{productId}/quality-gate:session-acceptances:
    post:
      description: |-
        Persists the close-policy ledger of a single intent session as
        agent_artifact provenance rows on that session's draft requirement. A
        re-run REPLACES this session's records for the same requirement set —
        keyed by (phase, session, requirement set), deliberately NOT by criterion,
        so a corrected criterion supersedes the earlier judgement instead of
        leaving two contradicting ones. Every other row on the draft is carried
        over.

        ORDERING: this endpoint rewrites the draft's whole source array. A caller
        that also writes sources to the same draft (the CLI's close extends the
        session_reconcile row in its own PUT) MUST call this FIRST and then
        RE-FETCH the requirement before building that write — a request assembled
        from a snapshot taken before this call silently erases the rows this call
        wrote.

        Validation is STRUCTURAL only: a known criterion, non-empty single-line
        evidence, a known follow-up kind, requirement refs that resolve on the
        intent branch, and a draft that lives there. The server never judges
        whether a reason is a good one — that judgment belongs to the agent's
        instructions and to the human reading merge-preview.
      operationId: QualityGateService_RecordSessionRiskAcceptances
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordSessionRiskAcceptancesBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordSessionRiskAcceptancesResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Records one intent session's risk acceptances and test deferrals.
      tags:
      - QualityGateService
  /v1/products/{productId}/quality-gate:session-progress:
    post:
      description: |-
        For the supplied requirement ids (the session's slice of interest) on the
        intent branch's merge-preview view, returns each requirement's coverage
        ladder step (no_test → not_run → failing → verified), its linked tests
        with per-test status and session attribution, a summary, an advisory
        `ready` flag, and deterministic next actions. Read-only; unknown
        requirement ids are silently omitted.
      operationId: QualityGateService_GetSessionProgress
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetSessionProgressBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSessionProgressResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Returns one intent session's per-requirement progress slice.
      tags:
      - QualityGateService
  /v1/products/{productId}/releases:
    get:
      description: |-
        Optionally filtered by environment slug; paginated via
        pagination.page_size/page_token.
      operationId: ReleaseService_ListReleases
      parameters:
