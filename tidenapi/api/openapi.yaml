openapi: 3.0.0
info:
  description: "REST API for external consumers: the tiden CLI, reporters, and generated\
    \ API clients. Authenticate with an API token (`Authorization: Bearer tfy_...`)\
    \ created in the app UI or via the CLI device-code flow."
  title: Tiden Public API
  version: 1.0.0
servers:
- url: https://api.tiden.ai
security:
- BearerAuth: []
tags:
- description: |-
    AgentService (public): agent-type discovery + config list/get/create/delete
    (the CLI surface). Config update and memory/trigger administration stay in
    api.v1 (web-only).
  name: AgentService
- description: |-
    AgentRetrievalService (public): the retrieval surface for coding agents —
    coverage gaps, per-requirement test context, the requirement graph (impact,
    neighbors, anchors, edges), and feature-context resolution. Read RPCs are
    side-effect free; the edge/attribution writes feed the shift-left graph.
  name: AgentRetrievalService
- description: |-
    AgentRunService (public): start/cancel/inspect agent runs and tail their
    events (the CLI + automation surface). Artifact listing/URLs stay in api.v1
    (web-only).
  name: AgentRunService
- description: |-
    AuthService exposes the session-independent identity surface (whoami +
    onboarding progress). Login/Signup/Refresh/ChangePassword stay in api.v1 —
    they are cookie/credential flows and must never be reachable with an API
    token or on the api host.
  name: AuthService
- description: |-
    BranchService (public): the full branching surface — every method is used by
    the CLI or agent-worker (branch create/list/get, merge preview, merge,
    delete). Moved wholesale from api.v1.
  name: BranchService
- description: |-
    ComponentService (public): list/create/update components (the CLI surface).
    Update is public so the CLI's discover-components (shift-left v3) can backfill
    repository/component_paths on existing components. Get/delete stay in api.v1
    (web-only).
  name: ComponentService
- description: |-
    EnvironmentService (public): the CLI's environment surface. Update stays in
    api.v1 (web-only).
  name: EnvironmentService
- description: |-
    IntentService (public): the backend (engine:"backend") distill path for the
    cross-agent intent pipeline, called by the CLI. Moved wholesale from api.v1.
  name: IntentService
- description: |-
    IntentSessionService (public): the server-side record of a coding-agent
    intent session. UpsertIntentSession is the single mutation entry point for
    the whole session lifecycle (start/refine/materialize/verdict/close
    patches, plus radius drops); Get/List are the read side, and List doubles
    as both the CLI's capability probe for this RPC family (a 404 on the
    collection route means an older server) and the cross-machine "find my
    open session by git branch" lookup. RecordSessionSettlement is the
    distillation-decision write. billing_exempt: this is the CLI's own
    bookkeeping, not a billable product action (AgentRunService precedent).
  name: IntentSessionService
- description: |-
    IssueService (public) is the API-token surface for error tracking: issue
    discovery, occurrence detail with symbolicated stack frames, per-environment
    impact, release regression checks, and status changes — plus the two-phase
    source-map upload the @tiden/telemetry-sourcemaps bundler plugin performs
    from CI.

    Deliberately not here: DSN client-key administration (minting an ingest
    credential), inbound-filter configuration, and the aggregate tiles that back
    the web Issues list and product overview. Those stay web-only in api.v1. The
    SDK-facing event ingest is the separate cmd/ingest process, not proto at all.
  name: IssueService
- description: |-
    ProductService (public): get/list/create products and verify CLI setup.
    Product update/delete and setup-state reads stay in api.v1 (web-only).
  name: ProductService
- description: |-
    QualityGateService (public): the gate's go/no-go decision, reached by the CLI /
    MCP server (tfy_ token) and agent-worker (minted JWT). v1 RPCs are UNARY only —
    streaming verdict updates are deferred until ChainStreamInterceptor is verified
    wired (StreamAgentRun is dead today for that reason; see design doc §13/A1).
  name: QualityGateService
- description: |-
    ReleaseService (public): moved wholesale from api.v1 — releases are a
    CI/SDK-facing surface end to end.
  name: ReleaseService
- description: |-
    RequirementService (public): requirement CRUD for the CLI and agent-worker.
    Move/history/restore stay in api.v1 (web-only).
  name: RequirementService
- description: |-
    TestService (public): test CRUD (incl. update), requirement links, and the
    reporter ingest endpoint. Move/history stay in api.v1 (web-only).
  name: TestService
- description: |-
    TestRunService (public): the CI-reporter and CLI surface for test runs.
    Runs are created by reporters, fed result batches, then completed; the run
    computes its final status once at completion. UpdateTestRun stays in api.v1
    (web-only). billing_exempt: CI ingestion must not bounce off the billing
    gate (AgentRunService precedent).
  name: TestRunService
- description: |-
    WorkspaceService (public) carries only the read the CLI needs to resolve its
    workspace context. Workspace CRUD, membership, and invite administration
    stay in api.v1 (web-only).
  name: WorkspaceService
paths:
  /v1/agent-configs/{agentConfigId}/runs:
    get:
      description: |-
        Returns the config's runs, newest first, with page_size/page_token
        pagination.
      operationId: AgentRunService_ListAgentRuns
      parameters:
      - explode: false
        in: path
        name: agentConfigId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentRunsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists the runs of an agent configuration.
      tags:
      - AgentRunService
    post:
      description: |-
        Enqueues a new run (status "pending") for execution; the call returns
        without waiting for it to finish. Fails when the
        config is disabled. inputs_override_json overrides the config's
        inputs_json for this run only, without persisting it. Follow progress via
        GetAgentRun or ListAgentRunEvents.
      operationId: AgentRunService_StartAgentRun
      parameters:
      - explode: false
        in: path
        name: agentConfigId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentRunBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartAgentRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Starts a run of an agent configuration.
      tags:
      - AgentRunService
  /v1/agent-configs/{id}:
    delete:
      description: |-
        Permanently removes the config; scheduled executions stop. Not
        reversible.
      operationId: AgentService_DeleteAgentConfig
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAgentConfigResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Deletes an agent configuration.
      tags:
      - AgentService
    get:
      description: |-
        Returns the config including inputs_json (parse against the agent type's
        input_schema_json), schedule, and credential references.
      operationId: AgentService_GetAgentConfig
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAgentConfigResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one agent configuration by id.
      tags:
      - AgentService
  /v1/agent-runs/{id}:
    get:
      description: |-
        Returns the run with its status, trigger, timing, LLM token/cost counters,
        error summary, the branch it produced (if any), and the structured result
        when the run reported one.
      operationId: AgentRunService_GetAgentRun
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAgentRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one agent run by id.
      tags:
      - AgentRunService
  /v1/agent-runs/{id}:cancel:
    post:
      description: |-
        Transitions the run to "cancelled" and records the reason (default
        "cancelled by user"). Only pending/running runs transition; a run that
        already finished is returned unchanged, so the call is safe to retry.
      operationId: AgentRunService_CancelAgentRun
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAgentRunBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelAgentRunResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Cancels a pending or running agent run.
      tags:
      - AgentRunService
  /v1/agent-runs/{runId}/events:
    get:
      description: |-
        Returns the run's timestamped events (level, kind, message, structured
        data) with page_size/page_token pagination — the polling alternative to
        StreamAgentRun.
      operationId: AgentRunService_ListAgentRunEvents
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentRunEventsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists the event log of an agent run.
      tags:
      - AgentRunService
  /v1/agent-runs/{runId}/events:stream:
    get:
      description: |-
        Server-streams AgentRunEvent messages for the run, resuming after
        after_event_id when set (empty streams from the beginning). Over REST the
        gateway delivers the stream as chunked newline-delimited JSON.
      operationId: AgentRunService_StreamAgentRun
      parameters:
      - explode: false
        in: path
        name: runId
        required: true
        schema:
          type: string
        style: simple
      - description: resume from this event id (cursor); empty starts from the beginning.
        explode: true
        in: query
        name: afterEventId
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream_result_of_AgentRunEvent"
          description: A successful response.(streaming responses)
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Streams an agent run's events as they happen.
      tags:
      - AgentRunService
  /v1/agent-types:
    get:
      description: |-
        Returns every code-defined agent capability with its input JSON Schema
        (input_schema_json), supported LLM providers, per-provider default models,
        and whether it needs a data credential or produces a branch. The catalog
        is global — not product-scoped.
      operationId: AgentService_ListAgentTypes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentTypesResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists the catalog of available agent types.
      tags:
      - AgentService
  /v1/auth/me:
    get:
      description: |-
        Resolves the caller from the presented credential (API token or session)
        and returns the user's id, email, name, and avatar URL. The CLI uses it
        to verify that a token is valid and who it belongs to.
      operationId: AuthService_GetCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentUserResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Returns the authenticated user (whoami).
      tags:
      - AuthService
  /v1/auth/onboarding:
    put:
      description: |-
        One-way latches: each of cli_verified, dismissed, and completed stamps its
        timestamp on the caller's onboarding state when true; false leaves the
        flag unchanged (flags cannot be un-set through this RPC). Returns the
        resulting onboarding state.
      operationId: AuthService_UpdateUserOnboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserOnboardingRequest"
        description: |-
          UpdateUserOnboardingRequest latches onboarding flags: each true field
          stamps its timestamp; false leaves the flag unchanged. wizard_step and
          answers are ordinary mutable state: an unset field is left untouched, a set
          one replaces the stored value.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserOnboardingResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Updates the caller's onboarding progress flags.
      tags:
      - AuthService
  /v1/branches/{branchId}/code-links:
    get:
      description: |-
        Returns every link recorded for the branch, pull requests before git
        branches, then most recently updated first.
      operationId: BranchService_ListBranchCodeLinks
      parameters:
      - explode: false
        in: path
        name: branchId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBranchCodeLinksResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: "Lists a branch's durable code links (git branches, pull requests)."
      tags:
      - BranchService
    post:
      description: |-
        Each entry is keyed by (kind, repository, ref): a repeat of an existing
        key updates url/title/state/base_sha/head_sha instead of duplicating.
        kind must be "git_branch" or "pull_request"; state must be "", "open",
        "merged", or "closed". Fails closed on the first invalid entry — nothing
        is written if any entry is invalid.
      operationId: BranchService_UpsertBranchCodeLinks
      parameters:
      - explode: false
        in: path
        name: branchId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBranchCodeLinksBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertBranchCodeLinksResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Upserts a batch of code links onto a branch.
      tags:
      - BranchService
  /v1/branches/{branchId}/link-proposals:
    get:
      description: |-
        Returns the link/unlink proposals recorded on the branch, optionally
        filtered by statuses (proposed | accepted | rejected). Accepted proposals
        become durable links when the branch merges.
      operationId: TestService_ListBranchLinkProposals
      parameters:
      - explode: false
        in: path
        name: branchId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: statuses
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBranchLinkProposalsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a branch's test-requirement link proposals.
      tags:
      - TestService
  /v1/branches/{branchId}/link-proposals:review:
    post:
      description: |-
        Applies decision ("accepted" | "rejected"), with an optional review_note,
        to the given proposal_ids (at least one required). Accepted proposals
        materialize into durable links at branch merge; rejected ones are dropped.
      operationId: TestService_ReviewBranchLinkProposals
      parameters:
      - explode: false
        in: path
        name: branchId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewBranchLinkProposalsBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewBranchLinkProposalsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Accepts or rejects branch link proposals.
      tags:
      - TestService
  /v1/branches/{id}:
    delete:
      description: |-
        Permanently drops the branch's local requirement/test/component copies and
        deletion markers; main is unaffected. Deletion history is recorded per
        discarded requirement. The main branch cannot be deleted.
      operationId: BranchService_DeleteBranch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Deletes a branch and discards its copy-on-write changes.
      tags:
      - BranchService
    get:
      description: |-
        Returns the branch with its status and metadata. Change stats are only
        populated by ListBranches with include_stats=true.
      operationId: BranchService_GetBranch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one branch by id.
      tags:
      - BranchService
    patch:
      description: |-
        Both request fields are optional: an absent field leaves the branch's
        current value unchanged, a present field (including an empty string)
        sets it. created_by_agent is validated server-side against a fixed
        allowlist — an unrecognized value is stored as empty string.
      operationId: BranchService_UpdateBranch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Updates a branch's description and/or created_by_agent.
      tags:
      - BranchService
  /v1/branches/{id}/merge:
    post:
      description: |-
        Applies the branch's additions/modifications/deletions to main in one
        transaction. Every conflicting entity requires a resolutions entry keyed
        "req:<uuid>", "test:<uuid>", or "comp:<uuid>" with value KEEP_BRANCH or
        KEEP_MAIN — otherwise the call fails with UNRESOLVED_CONFLICT and nothing
        is applied. Only open branches can merge; main cannot merge into itself.
      operationId: BranchService_MergeBranch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeBranchBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Merges a branch's changes into main and closes the branch.
      tags:
      - BranchService
  /v1/branches/{id}/merge-preview:
    get:
      description: |-
        Returns the additions, modifications (with per-field conflict flags), and
        deletions the merge would apply, for requirements, tests, and components,
        plus aggregate stats. A conflict means main changed the entity after the
        branch took its copy. Read-only — nothing is written.
      operationId: BranchService_GetMergePreview
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMergePreviewResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Previews the effect of merging a branch into main.
      tags:
      - BranchService
  /v1/components/{id}:
    put:
      description: |-
        name/description change only when present — omitted fields keep their
        stored value. Repository scoping uses explicit flags: set_repository,
        set_component_paths, and set_repository_aliases must be true for the
        paired value to be applied (including clearing it); false leaves the
        stored value untouched. branch (empty = main) writes copy-on-write.
      operationId: ComponentService_UpdateComponent
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateComponentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Updates a component.
      tags:
      - ComponentService
  /v1/environments/{id}:
    delete:
      description: |-
        Permanently removes the environment from the product. Test runs and
        releases that referenced it keep their recorded slug.
      operationId: EnvironmentService_DeleteEnvironment
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteEnvironmentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Deletes an environment.
      tags:
      - EnvironmentService
    get:
      description: "Returns the environment including its slug, host, type, and origin."
      operationId: EnvironmentService_GetEnvironment
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEnvironmentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one environment by id.
      tags:
      - EnvironmentService
  /v1/issues/{id}:
    get:
      description: |-
        The occurrence carries server-resolved (symbolicated) stack frames with the
        surrounding source lines, which is what identifies the code to fix.
      operationId: IssueService_GetIssue
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIssueResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Gets one issue together with its most recent occurrence.
      tags:
      - IssueService
  /v1/issues/{id}/events:
    get:
      description: Stack frames are not resolved here — fetch a single occurrence
        for those.
      operationId: IssueService_ListIssueEvents
      parameters:
      - description: issue id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIssueEventsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: "Lists an issue's individual occurrences, most recent first."
      tags:
      - IssueService
  /v1/issues/{id}/events/{eventId}:
    get:
      description: |-
        Use this when the occurrence that matters is not the most recent one — for
        example the production occurrence of an issue whose latest event came from
        staging.
      operationId: IssueService_GetIssueEvent
      parameters:
      - description: issue id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: "issue_events.id (row id, not the SDK event_id)"
        explode: false
        in: path
        name: eventId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIssueEventResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Gets one occurrence of an issue with symbolicated stack frames.
      tags:
      - IssueService
  /v1/issues/{id}/stats:
    get:
      description: |-
        An issue carries no environment of its own — environment lives on each
        occurrence — so this is how you tell a production outage from dev noise.
      operationId: IssueService_GetIssueEventStats
      parameters:
      - description: issue id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIssueEventStatsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: |-
        Returns occurrence statistics for one issue: counts bucketed over time
        plus a per-environment split.
      tags:
      - IssueService
  /v1/issues/{id}:setStatus:
    post:
      description: |-
        Every transition is recorded with its actor and is reversible. A resolved
        issue that recurs is reopened automatically and stamped as a regression.
      operationId: IssueService_UpdateIssueStatus
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueStatusBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateIssueStatusResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: "Sets one issue's status to unresolved, resolved, or ignored."
      tags:
      - IssueService
  /v1/products/{id}:
    get:
      description: |-
        Lets the CLI / agents resolve a bound product's details (e.g. its name for
        `tiden doctor`) without paging the whole workspace list. Tenancy is
        enforced via the id's TENANT_ANCHOR_PRODUCT anchor.
      operationId: ProductService_GetProduct
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProductResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Fetches one product by id.
      tags:
      - ProductService
  /v1/products/{productId}/agent-configs:
    get:
      description: |-
        Returns every agent config of the product, including its inputs, optional
        cron schedule, and credential references (never credential secrets).
      operationId: AgentService_ListAgentConfigs
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentConfigsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a product's agent configurations.
      tags:
      - AgentService
    post:
      description: |-
        Binds an agent_type to the product with a name, inputs_json matching the
        type's input schema, optional LLM/data credential references, and an
        optional cron schedule (schedule_cron + schedule_timezone). Runs are
        started separately via StartAgentRun, the schedule, or a trigger.
      operationId: AgentService_CreateAgentConfig
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentConfigBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentConfigResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Creates an agent configuration in a product.
      tags:
      - AgentService
  /v1/products/{productId}/attachments/{hash}:
    get:
      description: |-
        Resolves a hash uploaded via the reporter multipart route
        POST /v1/products/{product_id}/attachments:upload to a fresh presigned
        download URL (15-minute expiry, attachment disposition). Content-
        addressed: the same hash always names the same bytes within a product.
        Public so reporter/CLI clients and the SPA (JWT) can both fetch; an
        unknown hash returns ATTACHMENT_NOT_FOUND (HTTP 404).
      operationId: TestRunService_GetRunAttachment
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: sha256 hex content hash
        explode: false
        in: path
        name: hash
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRunAttachmentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Resolves an attachment content hash to a download URL.
      tags:
      - TestRunService
  /v1/products/{productId}/branches:
    get:
      description: |-
        Returns every branch including main. Set include_stats to add per-branch
        change counts vs main (additions/modifications/deletions per entity kind,
        plus conflicts). Set include_status to add loop/latest-run/code-link/
        intent-capture signals (Branch.loop/.latest_run/.code_links/.intent) —
        independent of include_stats, each is its own fixed-query-count batch
        read, so a caller that needs only the branch list is not charged for it.
      operationId: BranchService_ListBranches
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: |-
          When true, each returned Branch carries BranchChangeStats (per-branch
          change counts vs main).
        explode: true
        in: query
        name: includeStats
        required: false
        schema:
          type: boolean
        style: form
      - description: |-
          When true, each returned Branch carries loop/latest-run/code-link/intent
          status signals (Branch.loop, .latest_run, .code_links, .intent). Kept
          separate from include_stats: the sidebar branch dropdown calls List
          without stats and must not pay for this extra work either.
        explode: true
        in: query
        name: includeStatus
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBranchesResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a product's branches.
      tags:
      - BranchService
    post:
      description: |-
        The branch starts as a view of main; edits made on it copy entities on
        write and flow back via MergeBranch. name must be lowercase alphanumeric
        with hyphens/underscores/slashes, at most 100 characters, and not "main".
        created_by_agent_run_id attributes branches created by an agent run.
      operationId: BranchService_CreateBranch
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBranchResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Creates a copy-on-write branch of a product's main line.
      tags:
      - BranchService
  /v1/products/{productId}/components:
    get:
      description: |-
        Returns the components in the branch view (empty branch = main), with
        page_size/page_token pagination.
      operationId: ComponentService_ListComponents
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListComponentsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a product's components.
      tags:
      - ComponentService
    post:
      description: |-
        Components are the product's deployment/architectural units. repository
        (canonical repo id), component_paths (path-prefix scopes within it), and
        repository_aliases (local checkout paths) scope the component so changed
        files can be attributed to it. branch (empty = main) writes copy-on-write.
      operationId: ComponentService_CreateComponent
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateComponentResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Creates a component in a product.
      tags:
      - ComponentService
  /v1/products/{productId}/coverage-gaps:
    get:
      description: |-
        Returns the product's branch-effective coverage gaps, ranked for agent
        triage. Filter by coverage status (none | partial | covered | stale |
        unknown), component, free-text query, or a feature subtree via
        root_requirement_id. Paginated via pagination.page_size/page_token.
      operationId: AgentRetrievalService_ListCoverageGaps
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: branch
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: coverageStatuses
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - explode: true
        in: query
        name: componentId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      - description: scope gaps to a feature subtree (root + descendants)
        explode: true
        in: query
        name: rootRequirementId
        required: false
        schema:
          type: string
        style: form
      responses:
