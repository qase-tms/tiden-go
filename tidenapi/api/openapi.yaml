          requirementSeq: 0
          componentName: componentName
          requirementId: requirementId
        skippedUnownedCount: 5
        skippedMultiComponentCount: 1
        consideredCount: 5
      properties:
        attributed:
          description: |-
            Requirements newly attributed this run. Bounded (see
            maxReturnedAttributedRequirements in the service implementation) so a
            large product's backfill can't exceed the gRPC max message size; the DB
            write itself is unbounded — attributed_count is the true total.
          items:
            $ref: "#/components/schemas/AttributedRequirementComponent"
          type: array
        attributedCount:
          format: int32
          type: integer
        skippedMultiComponentCount:
          description: |-
            Requirements whose repo_file anchors resolved to more than one distinct
            component — left untouched.
          format: int32
          type: integer
        skippedUnownedCount:
          description: |-
            Requirements whose repo_file anchors resolved to no component at all
            (including a repository-ambiguous anchor path) — left untouched.
          format: int32
          type: integer
        consideredCount:
          description: |-
            Requirements evaluated: main-branch, non-deleted, component_id NULL, with
            at least one repo_file anchor.
          format: int32
          type: integer
      type: object
