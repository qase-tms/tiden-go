        verdict was computed over, for the matrix page and audit.
        subject_type/subject_id filter the matrix to one component or feature.
      operationId: QualityGateService_GetTraceability
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: string
        style: simple
      - description: |2-
           - VERDICT_SCOPE_RELEASE: canonical, against main-live entities of a release build
           - VERDICT_SCOPE_BRANCH: pre-merge preview, against the merge-preview projection
           - VERDICT_SCOPE_MAIN: current main, not tied to a release (latest exec per test)
        explode: true
        in: query
        name: scope
        required: false
        schema:
          default: VERDICT_SCOPE_UNSPECIFIED
