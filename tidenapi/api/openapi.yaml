      tags:
      - WorkspaceService
  /v1/workspaces/{workspaceId}/products:
    get:
      description: |-
        Returns the products page twice: products (bare) and items — the same page
        wrapped with per-product rollups (requirement/test-case counts, open
        branches, activation state, last activity) for list pages. Paginated via
        pagination.page_size/page_token.
      operationId: ProductService_ListProducts
      parameters:
      - explode: false
        in: path
        name: workspaceId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: pagination.pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pagination.pageToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProductsResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Lists a workspace's products.
      tags:
      - ProductService
    post:
      description: |-
        A product is the top-level container for requirements, tests, runs, and
        releases. code becomes the reference prefix for entity sequence numbers
        (e.g. "QA" yields QA-1, QA-2). team_id makes the product team-owned;
        empty leaves it workspace-owned and visible to all workspace members.
      operationId: ProductService_CreateProduct
      parameters:
      - explode: false
        in: path
        name: workspaceId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProductResponse"
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: An unexpected error response.
      summary: Creates a product in a workspace.
      tags:
      - ProductService
  /v1/products/{product_id}/attachments:upload:
    post:
      description: "Multipart upload used by the reporters before ReportResults: each\
        \ returned hash goes into a result's `attachments`. Not a gRPC method (multipart\
        \ is not expressible in protobuf), so it is served by a gateway HandlePath\
        \ route that authenticates the bearer token itself; see app/backend/internal/server/run_attachment_upload.go.\
        \ Limits per request: 20 files, 32 MiB per file, 128 MiB total, 5 minute read\
        \ deadline. Repeat the `file[]` part once per file (`file` is also accepted)."
      operationId: TestRunService_UploadRunAttachments
      parameters:
      - description: Product the attachments belong to.
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TestRunService_UploadRunAttachments_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsResponse"
          description: Every file was stored; hashes are returned in request order.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsError"
          description: "Not multipart, malformed body, no file part, or an invalid\
            \ product_id."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsError"
          description: Missing or invalid bearer token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsError"
          description: The token may not write to this product.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsError"
          description: Product not found.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsError"
          description: "A single file exceeded 32 MiB, or the request exceeded 128\
            \ MiB."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsError"
          description: "Per-identity upload rate limit, or too many concurrent uploads.\
            \ Retry shortly."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsError"
          description: The attachment could not be stored.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1UploadRunAttachmentsError"
          description: File storage is unavailable or unconfigured.
      summary: Uploads run attachments and returns their content hashes.
      tags:
      - TestRunService
components:
  schemas:
    AbortTestRunBody:
      type: object
    AbortTestRunResponse:
      example:
        run:
          clientMeta:
            key: clientMeta
          liveDocOperationId: liveDocOperationId
          configurations:
            key: configurations
          description: description
          startedAt: 2000-01-23T04:56:07.000+00:00
