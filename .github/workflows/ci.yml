name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        # testdata holds intentionally-broken fixture sources (build-failure goldens)
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v '/testdata/' || true)
          test -z "$UNFORMATTED" || (echo "$UNFORMATTED" && exit 1)
      - name: go vet
        run: go vet ./...
      - name: tests
        run: go test ./...
